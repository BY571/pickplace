[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "food-robot"
version = "0.1.0"
description = "Isaac Lab conveyor-belt food placement environment for TorchRL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torchrl>=0.14.0,<0.15",
    "tensordict>=0.14.2,<0.15",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["wandb>=0.19", "moviepy>=2", "seaborn>=0.13", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["food_robot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["isaac: requires Isaac Sim (runs scenario subprocesses, slow)"]
