# Stage 0 teacher v3b: fine-tune the working v2 teacher (98% deterministic success) with the v3 reward
# (finish the job: success needs the arm home too) but 10x smaller smoothness penalties (simple_v3b) — v3 trained
# from scratch collapsed policy entropy before the lift was ever discovered (see simple_v3b.yaml).
# Everything else is config.yaml. Launch: python pipeline/0_state_teacher/train.py --config-name config_v3b
defaults:
  - config
  - _self_

env:
  reward_set: simple_v3b       # food_robot/reward_sets/simple_v3b.yaml (simple_v3 with 10x smaller penalties)
  success_requires_home: true  # success needs the TCP within env home_tolerance (default 0.05 m) of home

init_checkpoint: /workspace/artifacts/teachers/teacher_simple_v2_600M_20260918_1307/checkpoints/ppo_teacher_390070272.pt

collector:
  total_frames: 300_000_000    # fine-tuning: shorter horizon than a from-scratch run

optim:
  lr: 1.0e-4                   # fine-tuning: lower than the from-scratch 3.0e-4

logger:
  exp_name: state_teacher_v3b
