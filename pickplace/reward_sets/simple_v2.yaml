# simple_v2 — simple_v1 plus food_in_bowl. Under simple_v1 the teacher grasped, lifted and carried the food to the
# bowl but never let go: transport pays up to 10/s only while the food is held, opening the gripper stops that
# instantly, and success (+100) needs the food to land and settle, which the policy rarely discovered. food_in_bowl
# pays while the food is inside the bowl AND released (same geometry as the success termination), so releasing over
# the bowl (20/s) pays more than hovering beside it with the food (at most 10/s). Dense weights are reward per second
# the term holds.
reach_food: 1.0
grasp: 2.0
grasp_lift: 5.0
transport: 10.0
food_in_bowl: 20.0
success: 100.0
