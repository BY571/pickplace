# Stage 0 teacher v3: finish the job (success = food settled in the bowl AND the arm back home) and smoother motion.
# Everything else is config.yaml. Launch: python pipeline/0_state_teacher/train.py --config-name config_v3
# (overnight with the test gate: ./scripts/launch_teacher_v3.sh).
defaults:
  - config
  - _self_

env:
  reward_set: simple_v3        # food_robot/reward_sets/simple_v3.yaml (return_home + motion penalties)
  success_requires_home: true  # success needs the arm within env home_tolerance (default 0.15 rad) of home

collector:
  total_frames: 1_000_000_000  # upper bound; early stop (4 evals in a row >= 0.85 success, where eval success
                               # now means placed AND home) normally ends the run sooner

logger:
  exp_name: state_teacher_v3
