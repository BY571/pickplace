# simple_v3b — the reward the pipeline uses, and the one every published teacher and dataset was made with.
#
# Reads as a ladder along the task: each stage pays more than the one before (1, 2, 5, 10, 20), so lingering
# at an earlier stage is never worth it, and `success` (150) dwarfs all of it. Dense terms are reward per
# second held; `success` is a one-shot bonus on the step the episode ends that way.
#
# The two motion penalties are deliberately tiny. At 10x these values a from-scratch run collapsed: policy
# entropy fell from 4.7 to -13.6 and the arm never discovered the lift, because a random policy's per-episode
# action_rate (~20-28) and joint_vel (~80-140) sums dominate the return long before reach_food or grasp pay
# anything. Small enough to smooth the motion, not large enough to become the objective.
#
# `transport_fine`, `bowl_failure` and `food_dropped` exist in the vocabulary (pickplace.rewards.REWARD_TERMS)
# but carry no weight here; they stay in the recorded reward vector so a dataset can be relabelled with them.
reach_food: 1.0
grasp: 2.0
grasp_lift: 5.0
transport: 10.0
food_in_bowl: 20.0
return_home: 10.0
success: 150.0
action_rate: -0.01
joint_vel: -0.001
bowl_disturbance: -10.0
