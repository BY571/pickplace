# Stage 0 — privileged state teacher (PPO from robot state + bowl pose + food pose; cameras off).
# Values marked "benchmark" come from the scaling sweep in docs/experiments/pipeline_stage0/benchmark.
env:
  task: FoodRobot-Cell-v0
  num_envs: 32768            # benchmark (docs/experiments/pipeline_stage0/benchmark)
  arm: franka
  food: rigid
  action_mode: ee_delta_pose
  cameras: false
  privileged_information: true
  belt:                      # same scene and DR as pixel PPO run 3
    speed: 0.08
    speed_noise: 0.0
    place_window: 5.0
    pallet_start_range: [-0.08, 0.08]
    bowl_offset_x: [-0.02, 0.02]
    bowl_offset_y: [-0.04, 0.04]
  ingredient_bowl_x_range: [0.45, 0.45]
  ingredient_bowl_y_range: [-0.10, -0.10]
  reward_set: simple_v3b     # pickplace/reward_sets/<name>.yaml
  success_requires_home: true  # simple_v3b pays return_home, so the episode must not end at the placement:
                               # success = food settled in the bowl AND the TCP back within home_tolerance
  reward_weights: {}         # per-run overrides on top of the set
  food_params: {}
  seed: 0
  device: cuda:0

app:
  headless: true

run:
  dir: null                  # null: $FOOD_ROBOT_ARTIFACTS/teachers/<name>
  name: null                 # null: teachers_<UTC timestamp>

init_checkpoint: null        # path to a teacher .pt: warm-start actor+critic from it (fresh optimizer, frames/
                              # iteration start at 0); fails loudly if the checkpoint's network config doesn't match

network:
  actor_in_keys: [proprio, belt, privileged]
  critic_in_keys: [proprio, belt, privileged]
  hidden: [512, 256, 128]

collector:
  rollout_steps: 16          # benchmark (docs/experiments/pipeline_stage0/benchmark)
  total_frames: 200_000_000  # also the LR annealing horizon

max_iterations: null         # overrides total_frames when set
max_hours: null              # stop cleanly (final checkpoint) after this much wall time

early_stop:
  success_rate: 0.85       # stop once eval success rate (worker.enabled required) reaches this for
  consecutive_evals: 4     # this many evaluations in a row (evals every checkpoint.interval_frames = 10 M
                            # frames -> 4 in a row ~= 40 M frames); success_rate: null disables

optim:
  lr: 3.0e-4
  anneal_lr: true
  max_grad_norm: 1.0
  matmul_precision: highest  # torch.set_float32_matmul_precision: highest (PyTorch default) | high | medium

loss:
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
  mini_batch_size: 32768     # benchmark: 2% slower than 131072 (269 vs 274 M frames/h) but 4x the gradient steps,
                             # i.e. the same ~24k per 200 M frames as the 4096-env run that learned (W&B zpk5xfwg)
  clip_epsilon: 0.2
  entropy_coeff: 0.005
  critic_coeff: 0.5
  shifted_gae: true          # benchmark (docs/experiments/pipeline_stage0/benchmark)
                             # GAE(shifted=True): one critic call over obs_0..obs_T instead of obs and next obs

compile:                     # torch.compile wiring as in TorchRL's sota-implementations/ppo/ppo_mujoco.py
  compile: false             # compile the PPO update, GAE and the collector's policy call
  compile_mode: null         # null: "reduce-overhead" ("default" with cudagraphs)
  cudagraphs: false          # CudaGraphModule on update/GAE + collector cudagraph_policy (experimental)

reward_scale: 0.1            # applied to the reward used for GAE/loss only; logged returns are unscaled

checkpoint:
  interval_frames: 10_000_000  # 0 disables periodic checkpoints (the final one is always written)

worker:                      # background evaluation + video of every checkpoint (separate Isaac Sim process)
  enabled: true
  eval_num_envs: 256         # envs in the deterministic evaluation (cameras off)
  render: true
  render_seconds: 12
  render_image: 128          # student camera size shown in the video
  on_exit: true              # evaluate/render the final checkpoint before exiting
  exit_timeout_s: 3600

logger:
  backend: wandb             # wandb | csv | tensorboard | null
  project_name: food_robot
  group: pipeline_teacher
  exp_name: state_teacher

hydra:
  job:
    chdir: false
  run:
    dir: outputs/pipeline_teacher/${now:%Y-%m-%d_%H-%M-%S}
