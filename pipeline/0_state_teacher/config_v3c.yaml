# Stage 0 teacher v3c — the config that trained the published teacher: config.yaml plus randomized start
# poses, warm-started from an earlier run.
# Why the randomization: without it the policy only ever starts from (almost) the same pose, and in the
# continuous demo it drifts into unseen poses and stalls after one or two cycles. With +-0.25 rad it places
# 20/20 bowls. Wider is worse, not better: at +-0.75 rad eval success stayed at 96-98% but placement
# precision dropped in the demo (16/20 bowls, 3 drops) for the same training budget.
# The reward (simple_v3b) and the home-aware success condition come from config.yaml.
# Launch: python pipeline/0_state_teacher/train.py --config-name config_v3c
#   (init_checkpoint=null trains from scratch; the path below is a run that no longer ships with the repo)
defaults:
  - config
  - _self_

env:
  robot_reset:
    position_range: [-0.25, 0.25]   # [rad]
    velocity_range: [-0.1, 0.1]     # [rad/s]

init_checkpoint: /workspace/artifacts/teachers/teacher_v2r_long_20260920T070700Z/checkpoints/ppo_teacher_final.pt

collector:
  total_frames: 300_000_000

optim:
  lr: 1.0e-4

early_stop:
  success_rate: 0.95           # success also requires the hand back home, so a slightly lower bar than a
  consecutive_evals: 4         # placement-only teacher would need

logger:
  exp_name: state_teacher_v3c
