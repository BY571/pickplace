# Environment (see docs/environment.md). Default: state-based teacher that sees privileged food state.
env:
  task: FoodRobot-Cell-v0
  num_envs: 4096
  arm: franka
  food: rigid
  action_mode: ee_delta_pose
  cameras: false
  image_size: [128, 128]
  privileged_information: true
  belt: {}          # e.g. {speed: 0.1, place_window: 4.0, pallet: {travel_upper: 2.0}, bowl: {mass: 0.3}}
  rewards: {}       # e.g. {reach_food: 2.0, bowl_disturbance: -2.0} -- one-shot terms (place_success,
                     # bowl_failure, food_dropped) go through success_bonus/bowl_failure_penalty/
                     # food_drop_penalty below instead, and raise KeyError if put here.
  food_params: {}   # e.g. {spawn_range: 0.03, mass: 0.04} -- forwarded to the food plug-in constructor
  seed: 0
  device: cuda:0
  # success_bonus: 150.0            # return added once on success
  # bowl_failure_penalty: 150.0     # return subtracted once when the bowl fails
  # food_drop_penalty: 150.0        # return subtracted once when the food falls off the table
  # success_settle_steps: 5
  # ingredient_bowl_pos: [0.45, -0.30, 0.0]
  # overview_cam_eye: [1.3, 0.0, 0.8]
  # overview_cam_target: [0.45, 0.0, 0.0]

app:
  headless: true

# Observation routing: a group name expands to all its terms; nested keys like [pixels, wrist_rgb] also work.
network:
  actor_in_keys: [proprio, belt, privileged]
  critic_in_keys: [proprio, belt, privileged]
  hidden: [256, 256, 128]
  cnn_channels: [32, 64, 64]
  embed_dim: 128

collector:
  rollout_steps: 24
  total_frames: 200_000_000

max_iterations: null   # overrides total_frames when set

optim:
  lr: 3.0e-4
  anneal_lr: true
  max_grad_norm: 1.0

loss:
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 5
  num_minibatches: 4
  clip_epsilon: 0.2
  entropy_coeff: 0.005
  critic_coeff: 0.5

logger:
  backend: csv      # csv | wandb | tensorboard | null
  project_name: food_robot
  exp_name: ppo

checkpoint:
  interval_iterations: 50

play:
  checkpoint: null
  steps: 1000
  num_envs: 16
  headless: false

hydra:
  job:
    chdir: true
