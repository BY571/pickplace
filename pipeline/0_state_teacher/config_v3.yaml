# Stage 0 teacher v3: finish the job (success = food settled in the bowl AND the arm back home) and smoother motion.
# Everything else is config.yaml. Launch: python pipeline/0_state_teacher/train.py --config-name config_v3
# (overnight with the test gate: ./scripts/launch_teacher_v3.sh).
defaults:
  - config
  - _self_

env:
  reward_set: simple_v3        # pickplace/reward_sets/simple_v3.yaml (return_home + motion penalties)
  success_requires_home: true  # success needs the TCP within env home_tolerance (default 0.05 m) of home

collector:
  total_frames: 600_000_000    # the schedule that just worked (also the LR horizon); early stop (4 evals in a row
                               # >= 0.85 success, eval success = placed AND home) normally ends it sooner

logger:
  exp_name: state_teacher_v3
